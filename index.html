<!DOCTYPE html>
<html>
<head>
  <title>Patient Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f7f9fc;
    }

    h1 {
      color: #2c3e50;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

<h1>Patient Dashboard</h1>

<div id="patient" class="card">Loading patient...</div>
<div id="conditions" class="card"></div>
<div id="observations" class="card"></div>
<div id="medications" class="card"></div>

<script src="app.js"></script>

</body>
</html>
